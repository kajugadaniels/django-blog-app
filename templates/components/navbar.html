{% load static %}

<div class="navbar-container">
    <div class="container">
        <div class="top-navbar style-1">
            <div class="container p-0">
                <div class="row align-items-center">
                    <div class="col-lg-4">
                        <div class="date-weather mb-3 mb-lg-0">

                                <div class="col-6">
                                    <div class="item">
                                        <div class="icon me-3 pt-1">
                                            <i class="la la-calendar"></i>
                                        </div>
                                        <div class="inf" id="current-date"></div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="item">
                                        <div class="icon me-3 pt-1">
                                            <i class="la la-cloud-sun"></i>
                                        </div>
                                        <div class="inf" id="location-info"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-4 text-center">
                        <a href="{% url 'base:home' %}" class="logo-brand d-none d-lg-block">
                            <h1>Irebe.</h1>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <nav class="navbar navbar-expand-lg navbar-light style-1">
            <div class="container p-0">
                <div class="mob-nav-toggles d-flex align-items-center justify-content-between">
                    <button class="navbarList-icon me-lg-5" data-bs-toggle="offcanvas" href="#offcanvasExample"
                        role="button" aria-controls="offcanvasExample">
                        <span></span><span></span>
                    </button>
                    <a href="{% url 'base:home' %}" class="logo-brand d-block d-lg-none w-50 my-4">
                        <h1>Irebe.</h1>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <!-- Home Link -->
                        <li class="nav-item">
                            <a
                                href="{% url 'base:home' %}"
                                class="nav-link {% if request.resolver_match.url_name == 'home' %}active fw-bold{% endif %}"
                            >
                                Home
                            </a>
                        </li>
                        <!-- Loop through first eight categories -->
                        {% for category in categories|slice:":8" %}
                        <li class="nav-item">
                            <a
                                href="{% url 'base:showCategoryArticles' category.slug %}"
                                class="nav-link {% if request.resolver_match.url_name == 'showCategoryArticles' and request.resolver_match.kwargs.category_slug == category.slug %}active fw-bold{% endif %}"
                            >
                                {{ category.name }}
                            </a>
                        </li>
                        {% endfor %}
                    </ul>

                    <div class="nav-side">
                        <a href="#" class="icon-link search-btn-style1">
                            <i class="la la-search fs-4 sOpen-btn"></i>
                            <i class="la la-close fs-4 sClose-btn"></i>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="nav-search-style1">
            <div class="row justify-content-center align-items-center gx-lg-5">
                <div class="col-lg-4">
                    <div class="info">
                        <h5>
                            urashobora gushakisha ukurikije <br> icyiciro cyangwa umutwe wamakuru
                        </h5>
                    </div>
                </div>
                <div class="col-lg-6">
                    <form class="form">
                        <span class="color-777 fst-italic text-capitalize mb-2 fsz-13px">
                            Injira Ijambo ryibanze
                        </span>
                        <div class="form-group">
                            <span class="icon"><i class="la la-search"></i></span>
                            <input type="text" class="form-control" placeholder="Elon Musk ... ">
                            <button type="submit">Shakisha</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
    // Set the current date (day and full date)
    const now = new Date();
    const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const currentDay = days[now.getDay()];
    const currentDate = now.getDate();
    const currentMonth = months[now.getMonth()];
    const currentYear = now.getFullYear();

    document.getElementById("current-date").innerHTML =
        `<strong>${currentDay}</strong><p>${currentMonth} ${currentDate}, ${currentYear}</p>`;

    // Location and realtime clock
    const locationInfoEl = document.getElementById("location-info");
    let locationText = "Unknown City, Unknown Region, Unknown Country";

    fetch('https://ipinfo.io/json?token=1a9fe57f5148a2')
        .then(res => res.json())
        .then(data => {
            locationText = `${data.city || 'Unknown City'}, ${data.region || 'Unknown Region'}, ${data.country || 'Unknown Country'}`;
        })
        .catch(err => console.error("Error fetching location info:", err));

    function updateTime(){
        const now = new Date();
        const hh = String(now.getHours()).padStart(2,'0');
        const mm = String(now.getMinutes()).padStart(2,'0');
        const ss = String(now.getSeconds()).padStart(2,'0');
        locationInfoEl.innerHTML = `<strong>${locationText}</strong><p>${hh}:${mm}:${ss}</p>`;
    }

    updateTime();
    setInterval(updateTime, 1000);
});
</script>
