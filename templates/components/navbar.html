<script>
document.addEventListener("DOMContentLoaded", function(){
    // Set the current date (day and full date)
    const now = new Date();
    const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const currentDay = days[now.getDay()];
    const currentDate = now.getDate();
    const currentMonth = months[now.getMonth()];
    const currentYear = now.getFullYear();
    
    // Update current date block
    const currentDateEl = document.getElementById("current-date");
    if(currentDateEl){
        currentDateEl.innerHTML = `<strong>${currentDay}</strong><p>${currentMonth} ${currentDate}, ${currentYear}</p>`;
    }
    
    // Prepare location info element and variable for location text
    const locationInfoEl = document.getElementById("location-info");
    let locationText = "Unknown City, Unknown Region, Unknown Country";
    
    // Fetch location info from IPinfo
    fetch('https://ipinfo.io/json?token=1a9fe57f5148a2')
        .then(response => response.json())
        .then(data => {
            const city = data.city || "Unknown City";
            const region = data.region || "Unknown Region";
            const country = data.country || "Unknown Country";
            locationText = `${city}, ${region}, ${country}`;
        })
    .catch(error => {
            console.error("Error fetching location info:", error);
    });
    
    // Function to update time in realtime
    function updateTime(){
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const seconds = now.getSeconds().toString().padStart(2, '0');
        const currentTime = hours + ":" + minutes + ":" + seconds;
        if(locationInfoEl){
            locationInfoEl.innerHTML = `<strong>${locationText}</strong><p>${currentTime}</p>`;
        }
    }
    
    // Initial time update and then update every second
    updateTime();
    setInterval(updateTime, 1000);
});
</script>
